<div id="panelGarantias" style="display:none;">

    <div class="garantias-panel">

        <h2>🛡️ Garantías</h2>

        <input
            type="text"
            id="inputGarantia"
            placeholder="DNI o Número de Boleta"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            type="button"
            onclick="window.buscarGarantia()"
        >
            🔍 Buscar Garantía
        </button>

        <div id="resultadoGarantia"></div>

    </div>

</div>
