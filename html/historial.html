<div id="panelHistorialVentas" style="display:none;">

    <h2>📋 Historial de Ventas</h2>

    <div class="historial-buscador">

        <input
            type="search"
            id="inputBuscarHistorialVentas"
            placeholder="Boleta, producto, categoría, vendedor, tienda, método o fecha"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            type="button"
            id="btnBuscarHistorialVentas"
            onclick="window.buscarHistorialVentas()"
        >
            🔍 Buscar Venta
        </button>

        <button
            type="button"
            id="btnLimpiarHistorialVentas"
            onclick="window.limpiarBusquedaHistorialVentas()"
            title="Limpiar búsqueda"
        >
            ✕ Limpiar
        </button>

    </div>

    <p
        id="estadoBusquedaHistorialVentas"
        class="historial-busqueda-estado"
        aria-live="polite"
    ></p>

    <table>

        <thead>
            <tr>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Vendedor</th>
                <th>Tienda</th>
                <th>Total</th>
                <th>Método</th>

                <th id="columnaGanancia">
                    Ganancia
                </th>

                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="historialVentasTabla"></tbody>

    </table>

</div>
