<section
    id="centroControlAdmin"
    class="centro-control-desktop centro-control-premium"
    aria-label="Centro de Control Premium"
>

    <div class="centro-control-orbita"></div>
    <div class="centro-control-orbita centro-control-orbita-2"></div>

    <div class="centro-control-header premium-header">

        <div class="control-logo-premium">
            <span>⚡</span>
        </div>

        <div class="control-header-texto">

            <span class="control-eyebrow">
                Panel administrativo
            </span>

            <h3>Centro de Control</h3>

            <p>
                Accesos rápidos para gestionar ventas,
                caja, reportes e inventario.
            </p>

        </div>

    </div>

    <div class="centro-control-grid premium-grid">

        <button
            type="button"
            onclick="abrirModalPanel('panelHistorialVentas')"
            class="btn-toggle-producto control-card premium-card control-historial"
        >
            <span class="control-icono">📋</span>
            <strong>Historial</strong>
            <small>Ventas realizadas</small>
            <em>Ver movimientos</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('panelCajaDiaria')"
            class="btn-toggle-producto control-card premium-card control-caja"
        >
            <span class="control-icono">💰</span>
            <strong>Caja</strong>
            <small>Ingresos y cierre</small>
            <em>Control diario</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('panelReportes')"
            class="btn-toggle-producto control-card premium-card control-reportes"
        >
            <span class="control-icono">📊</span>
            <strong>Reportes</strong>
            <small>Estadísticas</small>
            <em>Ventas y métodos</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('panelDashboardEjecutivo')"
            class="btn-toggle-producto control-card premium-card control-dashboard"
        >
            <span class="control-icono">🧠</span>
            <strong>Ejecutivo</strong>
            <small>Resumen gerencial</small>
            <em>Vista del negocio</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('panelReporteVendedores')"
            class="btn-toggle-producto control-card premium-card control-vendedor"
        >
            <span class="control-icono">👤</span>
            <strong>Vendedor</strong>
            <small>Rendimiento</small>
            <em>Equipo comercial</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('zonaAdmin')"
            class="btn-toggle-producto control-card premium-card control-productos"
        >
            <span class="control-icono">⚙️</span>
            <strong>Productos</strong>
            <small>Inventario</small>
            <em>Gestión de stock</em>
        </button>

        <button
            type="button"
            onclick="abrirModalPanel('panelGarantias')"
            class="btn-toggle-producto control-card premium-card control-garantias"
        >
            <span class="control-icono">🛡️</span>
            <strong>Garantías</strong>
            <small>Soporte postventa</small>
            <em>Atención al cliente</em>
        </button>

    </div>

</section>
