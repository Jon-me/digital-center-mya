<section
    class="desktop-header-pro header-enterprise-full"
    aria-label="Encabezado principal"
>

    <div class="header-command-bar-full">

        <button
            type="button"
            onclick="cerrarSesion()"
            class="header-command-button header-command-logout"
        >
            <span class="header-command-icon" aria-hidden="true">↪</span>
            <span>Cerrar Sesión</span>
        </button>

        <div class="header-emblem-full" aria-label="Digital Center M&A">
            <img
                src="./header-logo-dc-fullwidth.png?v=HEADER27-2"
                alt=""
            >
        </div>

        <button
            type="button"
            onclick="actualizarSistema()"
            class="header-command-button header-command-update"
        >
            <span class="header-command-icon" aria-hidden="true">↻</span>
            <span>Actualizar Sistema</span>
        </button>

    </div>

    <div class="header-brand-panel-full">

        <img
            src="./header-title-fullwidth.png?v=HEADER27-2"
            alt="Digital Center M&A"
            class="header-brand-title-full"
        >

        <div class="header-brand-divider-full" aria-hidden="true">
            <span></span>
            <i>✦</i>
            <span></span>
        </div>

        <p class="header-brand-tagline-full">
            Tu negocio, en control total.
        </p>

    </div>

    <div class="search-pro-wrap search-dios-wrap">

        <span class="search-dios-icon" aria-hidden="true">⌕</span>

        <input
            type="text"
            id="buscador"
            placeholder="Buscar producto..."
            onkeyup="buscarProducto()"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            type="button"
            class="search-dios-filter btn-categorias-menu"
            onclick="toggleCategoriasMenu()"
            aria-label="Abrir categorías"
        >
            ☰
        </button>

    </div>

</section>
