<div class="zona-pos">

    <div class="panel-carrito">

<h3 id="tituloCarrito">
    🛒 Carrito (0)
</h3>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="carritoTabla"></tbody>
        </table>

        <h2 id="totalVenta">
            Total: S/ 0
        </h2>

       <button onclick="abrirCobroVenta()">
    💳 Cobrar Venta
</button>

<div class="carrito-resize-handle" title="Redimensionar carrito"></div>

</div>

<div id="panelCobroVenta" style="display:none;">

    <h2 class="titulo-cobro">💳 Cobrar Venta</h2>

<div class="cobro-top">

    <div class="cobro-descuento">
        <span class="cobro-icono">🏷️</span>

        <div class="cobro-descuento-info">
            <label>Descuento</label>

            <div class="input-descuento-wrap">
                <strong>S/</strong>
                <input id="descuentoVenta" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
            </div>
        </div>
    </div>

    <div class="resumen-cobro">

        <div class="resumen-card">
            <span class="resumen-icono">🛒</span>

            <div class="resumen-info">
                <p>Productos</p>
                <h3 id="resumenProductosCobro">0</h3>
                <small>Unidades</small>
            </div>
        </div>

        <div class="resumen-card total-card">
            <span class="resumen-icono">💵</span>

            <div class="resumen-info">
                <p>Total a cobrar</p>
                <h2 id="resumenTotalCobro">S/ 0.00</h2>
            </div>
        </div>

    </div>

</div>

<div class="selector-tienda-venta">
    <h3>🏪 Venta realizada desde</h3>

    <select id="tiendaVenta">
        <option value="principal">Mercado</option>
        <option value="sucursal">Peluquería</option>
    </select>
</div>

    <h3 class="seccion-cobro">💳 Métodos de Pago</h3>

  <div class="zona-pagos-pro zona-pagos-vip">

    <div id="pagosMixtos" class="pagos-grid-vip">

        <div class="metodo-pago-card efectivo">
            <img src="efectivo.png" class="logo-pago">
            <strong>Efectivo</strong>
            <input id="pagoEfectivo" type="number" min="0" step="0.01" placeholder="S/ 0.00">
        </div>

        <div class="metodo-pago-card yape">
            <img src="yape.png" class="logo-pago">
            <strong>Yape</strong>
            <input id="pagoYape" type="number" min="0" step="0.01" placeholder="S/ 0.00">
        </div>

        <div class="metodo-pago-card plin">
            <img src="plin.png" class="logo-pago">
            <strong>Plin</strong>
            <input id="pagoPlin" type="number" min="0" step="0.01" placeholder="S/ 0.00">
        </div>

        <div class="metodo-pago-card tarjeta">
            <img src="tarjeta.png" class="logo-pago">
            <strong>Tarjeta</strong>
            <input id="pagoTarjeta" type="number" min="0" step="0.01" placeholder="S/ 0.00">
        </div>

        <div class="metodo-pago-card transferencia">
            <img src="transferencia.png" class="logo-pago">
            <strong>Transferencia</strong>
            <input id="pagoTransferencia" type="number" min="0" step="0.01" placeholder="S/ 0.00">
        </div>

    </div>

    <div class="total-pagado-pro total-pagado-vip">
        <span>🧮</span>
        <p>Total Pagado</p>
        <h3 id="totalPagado">S/ 0.00</h3>

        <div class="linea-total-vip"></div>

        <p>Pendiente</p>
        <h2 id="totalPendienteCobro">S/ 0.00</h2>
    </div>

</div>

    <div class="acciones-venta acciones-cobro-rapido">
    <button onclick="finalizarVenta()">💾 Guardar Venta</button>
    <button onclick="abrirDatosClienteBoleta()">🧾 Cliente pide boleta</button>
</div>



</div>

    <section
        class="panel-productos productos-premium-panel"
        aria-label="Productos"
    >
        <div
            id="tablaProductos"
            class="productos-grid"
        ></div>
    </section>

</div>
