<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Center M&A</title>

<!-- Design System -->

<link rel="stylesheet" href="css/tokens.css?v=CSS25-6">

<link rel="stylesheet" href="css/base.css?v=CSS25-62">

<link rel="stylesheet" href="css/layout.css?v=CSS25-2">

<link rel="stylesheet" href="css/components.css?v=CSS25-48">

<link rel="stylesheet" href="css/catalogo.css?v=CSS25-60">

<link rel="stylesheet" href="css/carrito.css?v=CSS25-61">

<link rel="stylesheet" href="css/ventas.css?v=CSS25-65">

<link rel="stylesheet" href="css/modales.css?v=CSS25-64">

<link rel="stylesheet" href="css/dashboard.css?v=CSS25-40">

<link rel="stylesheet" href="css/caja.css?v=CSS25-41">

<link rel="stylesheet" href="css/garantias.css?v=CSS25-50">

<link rel="stylesheet" href="css/admin.css?v=CSS25-56">

<link rel="stylesheet" href="css/login.css?v=CSS25-65">

<link rel="stylesheet" href="css/header.css?v=CSS25-63">

<link rel="stylesheet" href="css/overrides.css?v=CSS25-1">

<!-- Icono y color de navegador -->

<link rel="icon" href="icon-192.png">

<meta name="theme-color" content="#0f172a">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
    rel="stylesheet"
>

</head>

<body>

<video autoplay muted loop playsinline id="videoFondoLaptop">
    <source src="./video-login.mp4?v=LAPTOP1" type="video/mp4">
</video>


<button id="btnSonido" onclick="toggleSonido()">
    🔊 Activar sonido
</button>

<div id="login" class="login-desktop-final" style="display: none;">

    <h2>Iniciar Sesión</h2>

    <input
    type="text"
    id="usuario"
    placeholder="Usuario"
    autocomplete="off"
>

    <input
    type="password"
    id="password"
    placeholder="Contraseña"
    autocomplete="off"
>

    <button onclick="iniciarSesion()">
        Entrar
    </button>

</div>

   <div class="container" id="sistema" style="display: none;">

<section class="desktop-header-pro header-dios-pro" aria-label="Encabezado principal">

    <div class="header-dios-bg"></div>
    <div class="header-dios-grid"></div>

    <div class="barra-superior desktop-actions-pro header-actions-dios">

        <button onclick="cerrarSesion()" class="btn-session-pro">
            <span class="btn-action-icon">↪</span>
            <span>Cerrar Sesión</span>
        </button>

        <div class="logo-ma-dios" aria-label="Logo M&A">
            <span class="logo-ma-m">M</span>
            <span class="logo-ma-a">A</span>
        </div>

        <button onclick="actualizarSistema()" class="btn-actualizar-sistema btn-update-pro">
            <span class="btn-action-icon">↻</span>
            <span>Actualizar Sistema</span>
        </button>

    </div>

    <div class="hero-banner hero-banner-pro hero-dios">
        <div class="hero-dios-shield">✦</div>

        <h1>
            <span class="brand-word-digital">Digital</span>
            <span class="brand-word-center">Center</span>
            <span class="brand-word-ma">M&A</span>
        </h1>

        <div class="hero-dios-line"></div>

        <div class="hero-dios-features">
            <span>🛒 Ventas</span>
            <span>📦 Inventario</span>
            <span>💳 Caja</span>
            <span>🛡️ Control</span>
        </div>
    </div>

    <div class="search-pro-wrap search-dios-wrap">
        <span class="search-dios-icon">⌕</span>

        <input 
            type="text"
            id="buscador"
            placeholder="Buscar producto..."
            onkeyup="buscarProducto()"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button type="button" class="search-dios-filter btn-categorias-menu" onclick="toggleCategoriasMenu()" aria-label="Abrir categorías">☰</button>
    </div>

</section>

<!-- FASE 26 — Fragmento Categorías -->
<div id="htmlCategorias"></div>

<!-- FASE 26 — Fragmento Ventas -->
<div id="htmlVentas"></div>

<!-- FASE 26 — Fragmento Centro de Control -->
<div id="htmlCentroControl"></div>

<!-- FASE 26 — Fragmento Historial -->
<div id="htmlHistorial"></div>

<!-- FASE 26 — Fragmento Reportes -->
<div id="htmlReportes"></div>

<!-- FASE 26 — Fragmento Dashboard Ejecutivo -->
<div id="htmlDashboard"></div>

<!-- FASE 26 — Fragmento Reporte de Vendedores -->
<div id="htmlReporteVendedores"></div>

<!-- FASE 26 — Fragmento Caja -->
<div id="htmlCaja"></div>

<!-- FASE 26 — Fragmento Garantías -->
<div id="htmlGarantias"></div>

<!-- FASE 26 — Fragmento Administración -->
<div id="htmlAdmin"></div>

<!-- FASE 26 — Fragmento Transferencias -->
<div id="htmlTransferencias"></div>

  <div id="modalCodigo" style="display:none;">

    <h3>🔐 Autorización Admin</h3>

   <input
    type="password"
    id="codigoAdminInput"
    placeholder="Ingrese Código"
    autocomplete="off"
>


    <button onclick="validarCodigoAdmin()">
        Aceptar
    </button>

    <button onclick="cerrarModalCodigo()">
        Cancelar
    </button>

</div>

<div
    id="fondoModal"
    style="display:none;"
></div>

<div id="modalDatosClienteBoleta" class="modal-boleta-cliente" style="display:none;">

    <div class="modal-boleta-contenido">

        <button class="cerrar-boleta-cliente" onclick="cerrarDatosClienteBoleta()">X</button>

        <h2>👤 Datos del Cliente</h2>

        <input id="clienteNombre" type="text" placeholder="👤 Nombre del Cliente" autocomplete="off">

        <input id="clienteDni" type="text" placeholder="🪪 DNI del Cliente" autocomplete="off">

        <button class="btn-finalizar-boleta" onclick="finalizarEImprimir()">
            🧾 Finalizar + Imprimir
        </button>

    </div>

</div>

<div id="modalPanel" class="modal-panel" style="display:none;">
    <div class="modal-contenido">
        <button
            class="cerrar-modal"
            onclick="cerrarModalPanel()">
            X
        </button>

        <div id="contenidoModalPanel"></div>
    </div>
</div>

</div><!-- FIN sistema -->

<script type="module" src="script.js?v=HTML26-13"></script>

</body>
</html>
