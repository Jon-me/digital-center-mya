<div class="mobile-section">

    <section class="mobile-card">

        <span class="mobile-badge mobile-badge-success">
            Sistema operativo
        </span>

        <h1
            class="mobile-card-title"
            style="margin-top:14px;font-size:26px;"
        >
            Buenos días
        </h1>

        <p class="mobile-card-copy">
            Bienvenido a la nueva aplicación móvil
            de Digital Center M&A.
        </p>

    </section>

    <section class="mobile-section">

        <header class="mobile-section-header">

            <h2>
                Resumen
            </h2>

            <small>
                Vista móvil
            </small>

        </header>

        <div
            style="
                display:grid;
                grid-template-columns:repeat(2,minmax(0,1fr));
                gap:12px;
            "
        >

            <article class="mobile-metric-card">

                <small>
                    Ventas hoy
                </small>

                <strong>
                    S/ 0.00
                </strong>

            </article>

            <article class="mobile-metric-card">

                <small>
                    Productos
                </small>

                <strong>
                    0
                </strong>

            </article>

            <article class="mobile-metric-card">

                <small>
                    Caja
                </small>

                <strong>
                    Cerrada
                </strong>

            </article>

            <article class="mobile-metric-card">

                <small>
                    Garantías
                </small>

                <strong>
                    0
                </strong>

            </article>

        </div>

    </section>

    <section class="mobile-section">

        <header class="mobile-section-header">

            <h2>
                Accesos rápidos
            </h2>

        </header>

        <div
            style="
                display:grid;
                gap:10px;
            "
        >

            <button
                type="button"
                class="mobile-button mobile-button-primary"
                data-mobile-go="ventas"
            >
                🛒 Nueva venta
            </button>

            <button
                type="button"
                class="mobile-button"
                data-mobile-go="inventario"
            >
                📦 Revisar inventario
            </button>

        </div>

    </section>

</div>
